<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#1F2937" stroke="#374151" stroke-width="1"/>
  
  <!-- Car body -->
  <path d="M6 18 L8 15 L12 14 L20 14 L24 15 L26 18 L26 22 L24 23 L22 23 L22 21 L10 21 L10 23 L8 23 L6 22 Z" fill="url(#carGradient)"/>
  
  <!-- Car windows -->
  <path d="M9 15 L11 13 L21 13 L23 15 L21 16 L11 16 Z" fill="#E5E7EB" opacity="0.8"/>
  
  <!-- Car wheels -->
  <circle cx="10" cy="22" r="2" fill="#374151"/>
  <circle cx="22" cy="22" r="2" fill="#374151"/>
  <circle cx="10" cy="22" r="1" fill="#6B7280"/>
  <circle cx="22" cy="22" r="1" fill="#6B7280"/>
  
  <!-- AI brain/circuit pattern -->
  <g fill="url(#aiGradient)" opacity="0.9">
    <!-- Central node -->
    <circle cx="16" cy="8" r="1.5"/>
    
    <!-- Connected nodes -->
    <circle cx="12" cy="6" r="1"/>
    <circle cx="20" cy="6" r="1"/>
    <circle cx="14" cy="10" r="0.8"/>
    <circle cx="18" cy="10" r="0.8"/>
    
    <!-- Connection lines -->
    <line x1="16" y1="8" x2="12" y2="6" stroke="url(#aiGradient)" stroke-width="0.8" opacity="0.7"/>
    <line x1="16" y1="8" x2="20" y2="6" stroke="url(#aiGradient)" stroke-width="0.8" opacity="0.7"/>
    <line x1="16" y1="8" x2="14" y2="10" stroke="url(#aiGradient)" stroke-width="0.8" opacity="0.7"/>
    <line x1="16" y1="8" x2="18" y2="10" stroke="url(#aiGradient)" stroke-width="0.8" opacity="0.7"/>
  </g>
  
  <!-- Subtle glow effect -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.3"/>
</svg>