<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradient for car -->
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient for AI/brain -->
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient for glow -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background circle with glow -->
  <circle cx="100" cy="100" r="95" fill="#1F2937"/>
  <circle cx="100" cy="100" r="95" fill="url(#glowGradient)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Car body -->
  <g transform="translate(100, 130)">
    <!-- Main body -->
    <path d="M-40,0 L-35,-15 L-25,-20 L25,-20 L35,-15 L40,0 L40,15 L35,20 L30,20 L30,10 L-30,10 L-30,20 L-35,20 L-40,15 Z"
          fill="url(#carGradient)" stroke="#1E40AF" stroke-width="1.5"/>

    <!-- Windows -->
    <path d="M-30,-15 L-20,-22 L20,-22 L30,-15 L25,-12 L-25,-12 Z"
          fill="#E5E7EB" opacity="0.9" stroke="#93C5FD" stroke-width="0.5"/>

    <!-- Headlights -->
    <ellipse cx="-35" cy="5" rx="3" ry="4" fill="#FCD34D" opacity="0.8"/>
    <ellipse cx="35" cy="5" rx="3" ry="4" fill="#FCD34D" opacity="0.8"/>

    <!-- Wheels -->
    <circle cx="-28" cy="18" r="8" fill="#374151" stroke="#1F2937" stroke-width="1"/>
    <circle cx="28" cy="18" r="8" fill="#374151" stroke="#1F2937" stroke-width="1"/>
    <circle cx="-28" cy="18" r="4" fill="#6B7280"/>
    <circle cx="28" cy="18" r="4" fill="#6B7280"/>
    <circle cx="-28" cy="18" r="2" fill="#9CA3AF"/>
    <circle cx="28" cy="18" r="2" fill="#9CA3AF"/>
  </g>

  <!-- AI Neural Network / Brain -->
  <g transform="translate(100, 50)">
    <!-- Central brain/processor -->
    <circle cx="0" cy="0" r="12" fill="url(#brainGradient)" stroke="#059669" stroke-width="2"/>

    <!-- Neural nodes - outer ring -->
    <circle cx="-25" cy="-10" r="6" fill="url(#brainGradient)" opacity="0.9"/>
    <circle cx="25" cy="-10" r="6" fill="url(#brainGradient)" opacity="0.9"/>
    <circle cx="-30" cy="15" r="5" fill="url(#brainGradient)" opacity="0.8"/>
    <circle cx="30" cy="15" r="5" fill="url(#brainGradient)" opacity="0.8"/>
    <circle cx="0" cy="-28" r="5" fill="url(#brainGradient)" opacity="0.8"/>

    <!-- Connection lines with animation effect -->
    <line x1="0" y1="0" x2="-25" y2="-10" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="25" y2="-10" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="-30" y2="15" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="30" y2="15" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="-28" stroke="url(#brainGradient)" stroke-width="2" opacity="0.6"/>

    <!-- Inner details -->
    <circle cx="-5" cy="-3" r="2" fill="#34D399" opacity="0.9"/>
    <circle cx="5" cy="-3" r="2" fill="#34D399" opacity="0.9"/>
    <circle cx="0" cy="4" r="2" fill="#34D399" opacity="0.9"/>

    <!-- Pulse circle -->
    <circle cx="0" cy="0" r="15" fill="none" stroke="#10B981" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Connecting data stream from AI to car -->
  <g opacity="0.5">
    <path d="M100,75 Q90,95 100,110"
          fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="100" cy="93" r="2" fill="#10B981"/>
    <circle cx="100" cy="98" r="1.5" fill="#10B981"/>
  </g>

  <!-- Outer decorative ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.2"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#10B981" stroke-width="0.5" opacity="0.3"/>
</svg>
