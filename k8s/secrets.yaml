apiVersion: v1
kind: Secret
metadata:
  name: automind-secrets
  namespace: automind
type: Opaque
data:
  # Base64 encoded values - replace with actual encoded secrets
  POSTGRES_DB: YXV0b21pbmRfZGI=  # automind_db
  POSTGRES_USER: YXV0b21pbmRfdXNlcg==  # automind_user
  POSTGRES_PASSWORD: YXV0b21pbmRfcGFzc3dvcmQ=  # automind_password
  REDIS_PASSWORD: ""  # Empty for no password
  JWT_SECRET: eW91cl9qd3Rfc2VjcmV0X2tleQ==  # your_jwt_secret_key
  
---
