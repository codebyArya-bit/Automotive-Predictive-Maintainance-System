name: AutoMind Recruiter Demo Audit
on:
  push:
    branches: [audit/recruiter-demo-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recruiter-browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AUTOMIND_BASE: https://automind-ai-git-audit-recruiter-8056e4-aryas-projects-6676c3c7.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q api
      - name: Verify deployed API contracts
        run: python -u scripts/test_demo_api.py
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Audit preview pages in Chromium
        run: python -u scripts/recruiter_audit.py
