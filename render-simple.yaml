services:
  # FastAPI Backend - Simplified for Free Tier
  - type: web
    name: automind-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python startup.py && gunicorn api_server:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: API_HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: sqlite:///./automotive_ai.db
      - key: USE_SQLITE
        value: true
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: MAX_RETRIES
        value: 3
      - key: CIRCUIT_BREAKER_THRESHOLD
        value: 5
      - key: HEALTH_CHECK_INTERVAL
        value: 30
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://automind-ai.vercel.app
      - key: LLM_PROVIDER
        value: rule_based
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
