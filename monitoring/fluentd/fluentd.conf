# Fluentd configuration for AutoMind log collection

<system>
  log_level info
</system>

# Input plugins
<source>
  @type tail
  @id automind_api_logs
  path /var/log/containers/automind-api-*.log
  pos_file /var/log/fluentd-automind-api.log.pos
  tag kubernetes.automind.api
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</source>

<source>
  @type tail
  @id celery_logs
  path /var/log/containers/celery-*.log
  pos_file /var/log/fluentd-celery.log.pos
  tag kubernetes.automind.celery
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</source>

<source>
  @type tail
  @id postgres_logs
  path /var/log/containers/postgres-*.log
  pos_file /var/log/fluentd-postgres.log.pos
  tag kubernetes.automind.postgres
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</source>

<source>
  @type tail
  @id redis_logs
  path /var/log/containers/redis-*.log
  pos_file /var/log/fluentd-redis.log.pos
  tag kubernetes.automind.redis
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</source>

# Kubernetes metadata enrichment
<filter kubernetes.**>
  @type kubernetes_metadata
  @id filter_kube_metadata
  kubernetes_url "#{ENV['FLUENT_FILTER_KUBERNETES_URL'] || 'https://' + ENV.fetch('KUBERNETES_SERVICE_HOST') + ':' + ENV.fetch('KUBERNETES_SERVICE_PORT') + '/api'}"
  verify_ssl "#{ENV['KUBERNETES_VERIFY_SSL'] || true}"
  ca_file "#{ENV['KUBERNETES_CA_FILE']}"
  skip_labels "#{ENV['FLUENT_KUBERNETES_METADATA_SKIP_LABELS'] || 'false'}"
  skip_container_metadata "#{ENV['FLUENT_KUBERNETES_METADATA_SKIP_CONTAINER_METADATA'] || 'false'}"
  skip_master_url "#{ENV['FLUENT_KUBERNETES_METADATA_SKIP_MASTER_URL'] || 'false'}"
  skip_namespace_metadata "#{ENV['FLUENT_KUBERNETES_METADATA_SKIP_NAMESPACE_METADATA'] || 'false'}"
</filter>

# Log parsing and enrichment
<filter kubernetes.automind.api>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type json
  </parse>
</filter>

<filter kubernetes.automind.**>
  @type record_transformer
  <record>
    service ${tag_parts[2]}
    environment "#{ENV['ENVIRONMENT'] || 'development'}"
    cluster "#{ENV['CLUSTER_NAME'] || 'automind'}"
  </record>
</filter>

# Error detection and alerting
<filter kubernetes.automind.**>
  @type grep
  <regexp>
    key log
    pattern /ERROR|CRITICAL|FATAL/
  </regexp>
  <record>
    alert_level error
  </record>
</filter>

# Output to Loki
<match kubernetes.automind.**>
  @type loki
  @id out_loki
  url "#{ENV['LOKI_URL'] || 'http://loki:3100'}"
  username "#{ENV['LOKI_USERNAME']}"
  password "#{ENV['LOKI_PASSWORD']}"
  
  extra_labels {"job": "fluentd"}
  
  <label>
    service $.service
    environment $.environment
    cluster $.cluster
    namespace $.kubernetes.namespace_name
    pod $.kubernetes.pod_name
    container $.kubernetes.container_name
  </label>
  
  <buffer>
    @type file
    path /var/log/fluentd-buffers/loki.buffer
    flush_thread_count 2
    flush_interval 5s
    chunk_limit_size 2m
    queue_limit_length 32
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>

# Prometheus metrics
<source>
  @type prometheus
  bind 0.0.0.0
  port 24231
  metrics_path /metrics
</source>

<source>
  @type prometheus_output_monitor
  interval 10
  <labels>
    hostname ${hostname}
  </labels>
</source>

# Health check endpoint
<source>
  @type http
  port 9880
  bind 0.0.0.0
  body_size_limit 32m
  keepalive_timeout 10s
</source>

# Catch-all for unmatched logs
<match **>
  @type stdout
  @id stdout_output
</match>